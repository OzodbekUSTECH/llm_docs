            scrollToCitation(citationNumber) {
                console.log('[CITATION CLICK] Scrolling to citation', citationNumber);
                
                // Убедиться что info panel открыта
                if (this.infoPanel.classList.contains('collapsed')) {
                    this.toggleInfoPanel();
                }
                
                // Найти документ с таким рангом
                const docCard = document.querySelector(`.doc-card[data-doc-rank="${citationNumber}"]`);
                
                if (!docCard) {
                    console.warn(`Document with rank ${citationNumber} not found`);
                    return;
                }
                
                // Скроллить к документу в info panel
                this.infoPanelContent.scrollTo({
                    top: docCard.offsetTop - 20,
                    behavior: 'smooth'
                });
                
                // Раскрыть документ если свернут (используем новую структуру)
                if (docCard.classList.contains('collapsed')) {
                    this.toggleDocCard(citationNumber);
                }
                
                // Временно подсветить документ
                docCard.classList.add('highlight-active');
                setTimeout(() => {
                    docCard.classList.remove('highlight-active');
                }, 2000);
                
                // Подсветить evidences в документе
                const evidences = this.citationHighlights[citationNumber];
                if (evidences && evidences.length > 0) {
                    console.log(`[CITATION] Found ${evidences.length} evidences to highlight:`, evidences);
                    
                    // Создаем временное дополнительное подсвечивание для evidences
                    setTimeout(() => {
                        const highlightSpans = docCard.querySelectorAll('.citation-highlight');
                        highlightSpans.forEach((span, index) => {
                            // Добавляем пульсирующую анимацию
                            span.style.animation = 'pulse-highlight 1s ease-in-out 3';
                            setTimeout(() => {
                                span.style.animation = '';
                            }, 3000);
                        });
                    }, 500); // Даем время на раскрытие документа
                } else {
                    console.log(`[CITATION] No evidences found for doc ${citationNumber}`);
                }
            }

            // Document Selector Methods
            async loadAvailableDocuments() {
                try {
                    const response = await fetch('/documents?page=1&size=100', {
                        credentials: 'include'
                    });
                    if (!response.ok) throw new Error('Failed to load documents');
                    
                    const data = await response.json();
                    this.availableDocuments = data.items || [];
                    this.renderDocumentCheckboxes();
                } catch (error) {
                    console.error('Error loading documents:', error);
                    this.availableDocuments = [];
                }
            }

            renderDocumentCheckboxes() {
                if (!this.documentCheckboxes) return;
                
                this.documentCheckboxes.innerHTML = '';
                
                this.availableDocuments.forEach(doc => {
                    const checkboxItem = document.createElement('div');
                    checkboxItem.className = 'document-checkbox-item';
                    
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.id = `doc-${doc.id}`;
                    checkbox.value = doc.id;
                    checkbox.checked = this.selectedDocuments.has(doc.id);
                    
                    const label = document.createElement('label');
                    label.htmlFor = `doc-${doc.id}`;
                    label.textContent = doc.name || `Document ${doc.id}`;
                    
                    checkboxItem.appendChild(checkbox);
                    checkboxItem.appendChild(label);
                    this.documentCheckboxes.appendChild(checkboxItem);
                    
                    // Add change event listener
                    checkbox.addEventListener('change', (e) => {
                        if (e.target.checked) {
                            this.selectedDocuments.add(doc.id);
                        } else {
                            this.selectedDocuments.delete(doc.id);
                        }
                        this.updateSelectedDocsCount();
                    });
                });
            }

            toggleDocumentSelector() {
                const isExpanded = this.documentSelectorContent.classList.contains('expanded');
                
                if (isExpanded) {
                    this.documentSelectorContent.classList.remove('expanded');
                    this.toggleText.textContent = 'Select';
                } else {
                    this.documentSelectorContent.classList.add('expanded');
                    this.toggleText.textContent = 'Hide';
                    
                    // Load documents if not already loaded
                    if (this.availableDocuments.length === 0) {
                        this.loadAvailableDocuments();
                    }
                }
            }

            selectAllDocuments() {
                this.selectedDocuments.clear();
                this.availableDocuments.forEach(doc => {
                    this.selectedDocuments.add(doc.id);
                });
                this.updateDocumentCheckboxes();
                this.updateSelectedDocsCount();
            }

            deselectAllDocuments() {
                this.selectedDocuments.clear();
                this.updateDocumentCheckboxes();
                this.updateSelectedDocsCount();
            }

            updateDocumentCheckboxes() {
                const checkboxes = this.documentCheckboxes.querySelectorAll('input[type="checkbox"]');
                checkboxes.forEach(checkbox => {
                    checkbox.checked = this.selectedDocuments.has(checkbox.value);
                });
            }

            updateSelectedDocsCount() {
                if (this.selectedDocuments.size === 0) {
                    this.selectedDocsCount.textContent = '(All documents)';
                    this.documentFilterEnabled = false;
                } else {
                    this.selectedDocsCount.textContent = `(${this.selectedDocuments.size} selected)`;
                    this.documentFilterEnabled = true;
                }
            }

            applyDocumentFilter() {
                this.documentFilterEnabled = this.selectedDocuments.size > 0;
                this.toggleDocumentSelector(); // Hide the selector
                
                // Show a message about the filter
                if (this.documentFilterEnabled) {
                    this.addAssistantMessage(`🔍 Document filter applied: Searching in ${this.selectedDocuments.size} selected document(s).`);
                } else {
                    this.addAssistantMessage(`🔍 Document filter cleared: Searching in all documents.`);
                }
            }

            getSelectedDocumentIds() {
                return this.documentFilterEnabled ? Array.from(this.selectedDocuments) : null;
            }

        }



        // Инициализация приложения
        document.addEventListener('DOMContentLoaded', () => {
            window.chatApp = new ChatApp();
            
            // Logout handler
            document.getElementById('logoutBtn')?.addEventListener('click', async (e) => {
                e.preventDefault();
                
                if (confirm('Вы уверены, что хотите выйти?')) {
                    try {
                        await fetch('/auth/logout', {
                            method: 'POST',
                            credentials: 'include'
                        });
                        
                        // Clear local storage
                        localStorage.clear();
                        
                        // Redirect to login
                        window.location.href = '/login';
                    } catch (error) {
                        console.error('Logout error:', error);
                        // Force redirect even on error
                        window.location.href = '/login';
                    }
                }
            });
        });
    </script>
</body>
