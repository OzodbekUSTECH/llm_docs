<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Assistant - OpenAI RAG</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --main-bg: #ffffff;
            --secondary-bg: #f7f7f8;
            --assistant-bg: #f7f7f8;
            --user-bg: transparent;
            --border-color: #e5e7eb;
            --text-primary: #374151;
            --text-secondary: #6b7280;
            --accent-color: #10a37f;
            --hover-bg: #f3f4f6;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--secondary-bg);
            height: 100vh;
            display: flex;
            color: var(--text-primary);
            overflow: hidden;
        }

        .app-container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--secondary-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .sidebar.collapsed {
            transform: translateX(-100%);
            position: absolute;
            z-index: 20;
        }

        .sidebar-header {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .new-chat-btn {
            width: 100%;
            padding: 10px 16px;
            background: var(--main-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--text-primary);
            transition: all 0.2s;
        }

        .new-chat-btn:hover {
            background: var(--hover-bg);
        }

        .sidebar-nav {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .sidebar-nav-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: var(--accent-color);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            box-shadow: 0 2px 4px rgba(16, 163, 127, 0.2);
        }

        .sidebar-nav-btn:hover {
            background: #0d8a6b;
            transform: translateX(2px);
            box-shadow: 0 4px 8px rgba(16, 163, 127, 0.3);
        }

        .sidebar-nav-btn span:first-child {
            font-size: 18px;
        }

        .chats-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .chat-item {
            padding: 10px 12px;
            margin-bottom: 4px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .chat-item:hover {
            background: var(--hover-bg);
        }

        .chat-item.active {
            background: var(--accent-color);
            color: white;
        }

        .chat-item-content {
            flex: 1;
            min-width: 0;
        }

        .chat-item-title {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-item-date {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 2px;
        }

        .chat-item-delete {
            opacity: 0;
            padding: 4px 8px;
            border-radius: 4px;
            transition: opacity 0.2s;
            font-size: 16px;
            line-height: 1;
        }

        .chat-item:hover .chat-item-delete {
            opacity: 0.6;
        }

        .chat-item-delete:hover {
            opacity: 1 !important;
            background: rgba(255, 0, 0, 0.1);
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            background: var(--main-bg);
            min-width: 0; /* Allow shrinking */
        }

        /* Information Panel */
        .info-panel {
            width: 380px;
            background: var(--secondary-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .info-panel.collapsed {
            width: 0;
            border-left: none;
        }

        .info-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: var(--main-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .info-panel-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .info-icon {
            font-size: 20px;
        }

        .info-panel-toggle {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 4px;
            border-radius: 4px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .info-panel-toggle:hover {
            background: var(--hover-bg);
            color: var(--text-primary);
        }

        .info-panel.collapsed .info-panel-toggle svg {
            transform: rotate(180deg);
        }

        .info-panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .info-panel-content::-webkit-scrollbar {
            width: 6px;
        }

        .info-panel-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .info-panel-content::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        .info-panel-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-text {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .empty-hint {
            font-size: 13px;
            opacity: 0.7;
        }

        /* Document Card */
        .doc-card {
            background: var(--main-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }
        
        .doc-card.collapsed {
            padding: 12px 16px;
        }

        .doc-card:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--accent-color);
        }
        
        .docs-section {
            margin-bottom: 20px;
        }
        
        .section-header {
            font-weight: 600;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            padding: 8px 12px;
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.1) 0%, rgba(33, 150, 243, 0.05) 100%);
            border-left: 3px solid var(--accent-color);
            border-radius: 4px;
        }
        
        .doc-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 8px;
        }
        
        .doc-expand-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 14px;
            cursor: pointer;
            padding: 4px 8px;
            transition: transform 0.2s;
        }
        
        .doc-expand-btn:hover {
            transform: scale(1.2);
        }
        
        .doc-body {
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .doc-card-header {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .doc-rank {
            background: var(--accent-color);
            color: white;
            font-weight: 600;
            font-size: 14px;
            padding: 4px 10px;
            border-radius: 12px;
            min-width: 32px;
            text-align: center;
        }

        .doc-scores {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            margin-left: 12px;
        }

        .doc-score-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }

        .score-label {
            min-width: 70px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .score-progress {
            flex: 1;
            height: 6px;
            background: var(--secondary-bg);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }

        .score-progress-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .score-progress-fill.semantic {
            background: linear-gradient(90deg, #10a37f 0%, #0f9b73 100%);
        }

        .score-progress-fill.keyword {
            background: linear-gradient(90deg, #6366f1 0%, #4f46e5 100%);
        }

        .score-progress-fill.final {
            background: linear-gradient(90deg, #f59e0b 0%, #d97706 100%);
        }
        
        .score-progress-fill.llm {
            background: linear-gradient(90deg, #a855f7 0%, #7c3aed 100%);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.3);
        }

        .score-value {
            min-width: 42px;
            text-align: right;
            font-weight: 600;
            color: var(--text-primary);
        }

        .doc-metadata {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
            padding: 10px;
            background: var(--secondary-bg);
            border-radius: 6px;
            font-size: 13px;
        }

        .metadata-row {
            display: flex;
            gap: 8px;
        }

        .metadata-label {
            font-weight: 600;
            color: var(--text-secondary);
            min-width: 50px;
        }

        .metadata-value {
            color: var(--text-primary);
            flex: 1;
            word-break: break-word;
        }

        .doc-content {
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-primary);
            background: var(--secondary-bg);
            padding: 12px;
            border-radius: 6px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-break: break-word;
            transition: max-height 0.3s ease;
            position: relative;
        }

        .doc-content.expanded {
            max-height: none;
        }

        .doc-content-toggle {
            position: sticky;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to bottom, transparent, var(--secondary-bg) 50%);
            padding: 8px 0 4px;
            text-align: center;
            cursor: pointer;
            user-select: none;
        }

        .doc-content-toggle-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .doc-content-toggle-btn:hover {
            background: #0d8c6a;
            transform: translateY(-1px);
        }

        .doc-content::-webkit-scrollbar {
            width: 4px;
        }

        .doc-content::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 2px;
        }

        .rerank-badge {
            background: #8b5cf6;
            color: white;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 10px;
            font-weight: 600;
        }

        /* Citation highlight */
        .citation-highlight {
            background: linear-gradient(120deg, #d4fc79 0%, #96e6a1 100%);
            padding: 2px 4px;
            border-radius: 3px;
            font-weight: 500;
            box-shadow: 0 1px 3px rgba(134, 239, 172, 0.3);
            border-left: 3px solid #10a37f;
            display: inline;
            line-height: 1.8;
        }

        /* Clickable inline citation links */
        .citation-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #e0f2fe;
            color: #0369a1;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.85em;
            padding: 2px 7px;
            border-radius: 4px;
            border: 1.5px solid #7dd3fc;
            cursor: pointer;
            transition: all 0.2s;
            margin: 0 2px;
            vertical-align: baseline;
        }

        .citation-link:hover {
            background: #bae6fd;
            border-color: #0369a1;
            color: #0c4a6e;
            transform: translateY(-1px);
            box-shadow: 0 2px 6px rgba(3, 105, 161, 0.3);
        }

        .citation-link:active {
            transform: translateY(0);
        }

        /* Highlight document card when referenced */
        .doc-card.highlight-active {
            animation: highlightPulse 1s ease;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(16, 163, 127, 0.2);
        }

        @keyframes highlightPulse {
            0%, 100% { box-shadow: 0 0 0 3px rgba(16, 163, 127, 0.2); }
            50% { box-shadow: 0 0 0 6px rgba(16, 163, 127, 0.4); }
        }
        
        @keyframes pulse-highlight {
            0%, 100% { 
                background: linear-gradient(120deg, #d4fc79 0%, #96e6a1 100%);
                box-shadow: 0 1px 3px rgba(134, 239, 172, 0.3);
            }
            50% { 
                background: linear-gradient(120deg, #b8e673 0%, #7ad08a 100%);
                box-shadow: 0 2px 8px rgba(134, 239, 172, 0.6);
                transform: scale(1.02);
            }
        }

        .chat-header {
            background: var(--main-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(8px);
        }

        .chat-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .session-info {
            position: absolute;
            right: 16px;
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .session-info a {
            color: var(--accent-color);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .session-info a:hover {
            background: var(--hover-bg);
        }

        .nav-btn {
            background: var(--accent-color) !important;
            color: white !important;
            font-weight: 500;
            padding: 8px 16px !important;
            border-radius: 8px !important;
            box-shadow: 0 2px 4px rgba(16, 163, 127, 0.2);
        }

        .nav-btn:hover {
            background: #0d8a6b !important;
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(16, 163, 127, 0.3);
        }

        .logout-btn {
            color: #ef4444 !important;
        }

        .logout-btn:hover {
            background: #fef2f2 !important;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            background: var(--main-bg);
        }

        .message-group {
            width: 100%;
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }

        .message-group.user {
            background: var(--user-bg);
        }

        .message-group.assistant {
            background: var(--assistant-bg);
            transition: background 0.2s ease;
        }
        
        .message-group.assistant:hover {
            background: rgba(247, 247, 248, 0.8);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        
        .message-group.assistant[data-metadata]:hover {
            cursor: pointer;
        }
        
        .message-group.assistant[data-metadata]:hover::after {
            content: "📊 Click to view documents";
            position: absolute;
            right: 20px;
            top: 10px;
            background: rgba(16, 163, 127, 0.9);
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
            pointer-events: none;
            opacity: 0.8;
        }

        .message-wrapper {
            max-width: 768px;
            margin: 0 auto;
            padding: 24px 16px;
            display: flex;
            gap: 16px;
        }

        .message-avatar {
            width: 30px;
            height: 30px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 16px;
            flex-shrink: 0;
        }

        .message-avatar.user {
            background: #5436da;
            color: white;
        }

        .message-avatar.assistant {
            background: var(--accent-color);
            color: white;
        }

        .message-content {
            flex: 1;
            min-width: 0;
        }

        .message-text {
            line-height: 1.75;
            word-wrap: break-word;
            font-size: 16px;
            color: var(--text-primary);
        }

        /* Markdown content styling */
        .message-text h1, .message-text h2, .message-text h3, .message-text h4, .message-text h5, .message-text h6 {
            margin: 20px 0 12px 0;
            font-weight: 600;
            color: var(--text-primary);
        }

        .message-text h1 { font-size: 2em; }
        .message-text h2 { font-size: 1.5em; }
        .message-text h3 { font-size: 1.25em; }
        .message-text h4 { font-size: 1.1em; }
        .message-text h5 { font-size: 1em; }
        .message-text h6 { font-size: 0.9em; }

        .message-text p {
            margin: 12px 0;
            line-height: 1.7;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .message-text p:first-child {
            margin-top: 0;
        }

        .message-text p:last-child {
            margin-bottom: 0;
        }

        .message-text ul, .message-text ol {
            margin: 12px 0;
            padding-left: 28px;
            line-height: 1.7;
        }

        .message-text li {
            margin: 6px 0;
        }

        .message-text blockquote {
            margin: 16px 0;
            padding: 12px 20px;
            background: var(--hover-bg);
            border-left: 3px solid var(--accent-color);
            border-radius: 4px;
        }

        .message-text code {
            background: rgba(0, 0, 0, 0.05);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 0.875em;
            color: #d63384;
        }

        .message-text pre {
            margin: 16px 0;
            background: #000000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        .message-text pre code {
            display: block;
            padding: 16px;
            background: transparent;
            color: #e5e7eb;
            font-size: 14px;
            line-height: 1.6;
            overflow-x: auto;
            white-space: pre;
        }

        /* Pre-formatted text from documents (plain text without syntax highlighting) */
        .message-text pre:not(:has(code)) {
            background: var(--code-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 16px;
            font-size: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .code-block-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 12px;
            color: #9ca3af;
        }

        .code-language {
            font-weight: 500;
            text-transform: lowercase;
        }

        .copy-button {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #e5e7eb;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .copy-button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .copy-button.copied {
            background: var(--accent-color);
        }

        .message-text table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            font-size: 13px;
            line-height: 1.6;
        }

        .message-text th, .message-text td {
            padding: 10px 14px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            vertical-align: top;
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
        }

        .message-text th:last-child,
        .message-text td:last-child {
            border-right: none;
        }

        .message-text th {
            background: var(--hover-bg);
            font-weight: 600;
            color: var(--text-primary);
            font-size: 13px;
        }

        .message-text tr:hover {
            background: rgba(147, 51, 234, 0.03);
        }

        .message-text tr:last-child td {
            border-bottom: none;
        }

        /* Wrapper for large tables with horizontal scroll */
        .message-text .table-wrapper {
            width: 100%;
            overflow-x: auto;
            margin: 16px 0;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .message-text .table-wrapper::-webkit-scrollbar {
            height: 8px;
        }

        .message-text .table-wrapper::-webkit-scrollbar-track {
            background: var(--code-bg);
            border-radius: 0 0 6px 6px;
        }

        .message-text .table-wrapper::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .message-text .table-wrapper::-webkit-scrollbar-thumb:hover {
            background: #666;
        }

        .message-text .table-wrapper table {
            margin: 0;
            border: none;
        }

        .message-text a {
            color: var(--accent-color);
            text-decoration: underline;
            text-underline-offset: 2px;
        }

    <!-- JavaScript libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>

    <script>
        class ChatApp {
            constructor() {
                this.sessionId = this.generateSessionId();
                this.currentChatId = null;
                this.chats = [];
                this.isStreaming = false;
                this.currentAssistantMessage = null;
                this.currentReasoning = null;
                this.currentToolCalls = [];
                this.currentStreamingContent = '';
                this.userMessageProcessed = false;
                
                // Streaming abort controller
                this.abortController = null;
                this.streamingChatId = null;  // Track which chat is streaming
                
                // Retrieved documents for info panel
                this.retrievedDocs = [];
                this.citationHighlights = {}; // Map: doc_rank -> excerpt
                
                // Document selector state
                this.availableDocuments = [];
                this.selectedDocuments = new Set(); // Set of document IDs
                this.documentFilterEnabled = false;
                
                this.initializeElements();
                this.bindEvents();
                this.updateSessionId();
                this.setupAutoResize();
                this.initializeMarkdown();
                this.initializeChats();
            }

            initializeElements() {
                this.chatMessages = document.getElementById('chat-messages');
                this.messageInput = document.getElementById('message-input');
                this.sendButton = document.getElementById('send-button');
                this.chatForm = document.getElementById('chat-form');
                this.typingIndicator = document.getElementById('typing-indicator');
                this.sessionIdElement = document.getElementById('session-id');
                this.chatsList = document.getElementById('chats-list');
                this.newChatBtn = document.getElementById('new-chat-btn');
                
                // Info panel elements
                this.infoPanel = document.getElementById('info-panel');
                this.infoPanelContent = document.getElementById('info-panel-content');
                this.infoPanelToggle = document.getElementById('info-panel-toggle');
                
                // Document selector elements
                this.documentSelector = document.getElementById('document-selector');
                this.documentSelectorToggle = document.getElementById('document-selector-toggle');
                this.documentSelectorContent = document.getElementById('document-selector-content');
                this.documentCheckboxes = document.getElementById('document-checkboxes');
                this.selectedDocsCount = document.getElementById('selected-docs-count');
                this.toggleText = document.getElementById('toggle-text');
            }

            bindEvents() {
                this.chatForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.sendMessage();
                });

                this.messageInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.sendMessage();
                    }
                });

                this.newChatBtn.addEventListener('click', () => {
                    this.createNewChat();
                });

                // Info panel toggle
                this.infoPanelToggle.addEventListener('click', () => {
                    this.toggleInfoPanel();
                });
                
                // Document selector events
                this.documentSelectorToggle.addEventListener('click', () => {
                    this.toggleDocumentSelector();
                });
                
                document.getElementById('select-all-docs').addEventListener('click', () => {
                    this.selectAllDocuments();
                });
                
                document.getElementById('deselect-all-docs').addEventListener('click', () => {
                    this.deselectAllDocuments();
                });
                
                document.getElementById('apply-document-filter').addEventListener('click', () => {
                    this.applyDocumentFilter();
                });
            }

            setupAutoResize() {
                this.messageInput.addEventListener('input', () => {
                    this.messageInput.style.height = 'auto';
                    this.messageInput.style.height = Math.min(this.messageInput.scrollHeight, 200) + 'px';
                });
            }

            initializeMarkdown() {
                // Configure marked for better rendering
                if (typeof marked !== 'undefined') {
                    marked.setOptions({
                        breaks: true,          // Line breaks as <br>
                        gfm: true,             // GitHub Flavored Markdown
                        tables: true,          // Table support
                        sanitize: false,       // Не санитизируем (делаем вручную)
                        smartLists: true,      // Умные списки
                        smartypants: true,     // Умные кавычки
                        headerIds: true,       // ID для заголовков
                        mangle: false,         // Не искажать email
                        pedantic: false        // Не строгий режим
                    });
                    
                    // Кастомный рендерер для лучшего контроля
                    const renderer = new marked.Renderer();
                    
                    // Улучшенный рендеринг таблиц
                    renderer.table = function(header, body) {
                        return `<div class="table-wrapper">
                            <table>
                                <thead>${header}</thead>
                                <tbody>${body}</tbody>
                            </table>
                        </div>`;
                    };
                    
                    // Улучшенный рендеринг кода
                    renderer.code = function(code, language) {
                        const validLang = language || 'text';
                        return `<pre><code class="language-${validLang}">${code}</code></pre>`;
                    };
                    
                    marked.setOptions({ renderer });
                }

                // Configure Prism for syntax highlighting
                if (typeof Prism !== 'undefined') {
                    Prism.plugins.autoloader.languages_path = 'https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/';
                }
            }

            generateSessionId() {
                return 'session_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
            }

            updateSessionId() {
                if (this.sessionIdElement) {
                    this.sessionIdElement.textContent = this.sessionId;
                }
            }

             async sendMessage() {
                 const message = this.messageInput.value.trim();
                 if (!message || this.isStreaming) return;

                 // Полностью сбрасываем состояние сообщений
                 this.resetMessageState();

                 // Если нет текущего чата, создаем новый
                 if (!this.currentChatId) {
                     await this.createNewChat();
                 }

                 console.log('Sending message:', message, 'Chat:', this.currentChatId);
                 this.messageInput.value = '';
                 this.messageInput.style.height = 'auto';
                 
                 // Добавляем сообщение пользователя и ждем его полного рендеринга
                 await this.addUserMessage(message);
                 
                 // Дополнительная задержка для гарантии
                 await new Promise(resolve => setTimeout(resolve, 50));
                 
                 // Отмечаем, что сообщение пользователя полностью обработано
                 this.userMessageProcessed = true;
                 
                 this.setStreaming(true);
                 
                 // Reset streaming content
                 this.currentStreamingContent = '';
                
                // Clear info panel for new query
                this.clearInfoPanel();
                 
                 // Create new abort controller for this request
                 this.abortController = new AbortController();
                 this.streamingChatId = this.currentChatId;

                 // Debug: log selected document IDs
                 const selectedIds = this.getSelectedDocumentIds();
                 console.log('🔍 Selected document IDs:', selectedIds);

                try {
                    const response = await fetch(`/chat/generate?chat_id=${this.currentChatId}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        credentials: 'include',
                        signal: this.abortController.signal,
                        body: JSON.stringify({
                            message: message,
                            stream: true,
                            document_ids: this.getSelectedDocumentIds()
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    // Always use streaming now
                    await this.handleStreamResponse(response);
                } catch (error) {
                    if (error.name === 'AbortError') {
                        console.log('Request aborted (switched chat)');
                    } else {
                        console.error('Error:', error);
                        this.addErrorMessage(`Error: ${error.message}`);
                    }
                } finally {
                    this.setStreaming(false);
                    this.abortController = null;
                    this.streamingChatId = null;
                }
            }

             async handleStreamResponse(response) {
                 const reader = response.body.getReader();
                 const decoder = new TextDecoder();
                 let buffer = '';
                 let debugContainer = null;

                 try {
                     while (true) {
                         const { done, value } = await reader.read();
                         if (done) break;

                         buffer += decoder.decode(value, { stream: true });
                         const lines = buffer.split('\n');
                         buffer = lines.pop();

                         for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                try {
                                    const event = JSON.parse(line.slice(6));
                                    console.log('Stream event:', event);
                                    
                                    // Check if we're still in the same chat
                                    if (this.streamingChatId && this.streamingChatId !== this.currentChatId) {
                                        console.log('Ignoring event - chat switched');
                                        continue;
                                    }
                                    
                                    const channel = event.channel;
                                    const content = event.content;
                                    
                                    if (channel === 'debug') {
                                        // Debug information
                                        console.log('[DEBUG]', content);
                                        console.log('[DEBUG] State check - isStreaming:', this.isStreaming, 'userMessageProcessed:', this.userMessageProcessed, 'hasAssistantMessage:', !!this.currentAssistantMessage);
                                        
                                        // Only create assistant message if we're actually streaming AND user message is processed
                                        if (this.isStreaming && this.userMessageProcessed && !this.currentAssistantMessage) {
                                            console.log('[DEBUG] Creating assistant message for debug');
                                            this.currentAssistantMessage = this.createAssistantMessage();
                                        }
                                        
                                        // Only proceed if we have an assistant message
                                        if (this.currentAssistantMessage) {
                                            // Create debug container if needed
                                            if (!debugContainer) {
                                                debugContainer = this.createDebugContainer();
                                            }
                                            
                                            if (debugContainer) {
                                                this.addDebugMessage(debugContainer, content);
                                            }
                                            
                                            // Ensure debug container stays visible
                                            if (debugContainer && !debugContainer.classList.contains('collapsed')) {
                                                debugContainer.style.display = 'block';
                                            }
                                        } else {
                                            console.log('[DEBUG] Skipping debug message - no assistant message available');
                                        }
                                        
                                    } else if (channel === 'info') {
                                        // Document information
                                        console.log('[INFO]', content.substring(0, 100));
                                        console.log('[INFO] State check - isStreaming:', this.isStreaming, 'userMessageProcessed:', this.userMessageProcessed, 'hasAssistantMessage:', !!this.currentAssistantMessage);
                                        
                                        // Only create assistant message if we're actually streaming AND user message is processed
                                        if (this.isStreaming && this.userMessageProcessed && !this.currentAssistantMessage) {
                                            console.log('[INFO] Creating assistant message for info');
                                            this.currentAssistantMessage = this.createAssistantMessage();
                                        }
                                        
                                        // Only proceed if we have an assistant message
                                        if (this.currentAssistantMessage) {
                                            // Add to sources section
                                            this.addDocumentInfo(content);
                                        } else {
                                            console.log('[INFO] Skipping info message - no assistant message available');
                                        }
                                        
                                    } else if (channel === 'chat') {
                                        // Main response content
                                        console.log('[CHAT] State check - isStreaming:', this.isStreaming, 'userMessageProcessed:', this.userMessageProcessed, 'hasAssistantMessage:', !!this.currentAssistantMessage);
                                        
                                        // Only create assistant message if we're actually streaming AND user message is processed
                                        if (this.isStreaming && this.userMessageProcessed && !this.currentAssistantMessage) {
                                            console.log('[CHAT] Creating assistant message for chat');
                                            this.currentAssistantMessage = this.createAssistantMessage();
                                        }
                                        
                                        // Only proceed if we have an assistant message
                                        if (!this.currentAssistantMessage) {
                                            console.log('[CHAT] Skipping chat message - no assistant message available');
                                            return;
                                        }
                                        
                                             // Accumulate streaming content
                                        this.currentStreamingContent += content;
                                             const streamingDiv = this.currentAssistantMessage.querySelector('.message-text');
                                        
                                             if (streamingDiv) {
                                                 // Preserve debug container before updating content
                                                 const debugContainer = this.currentAssistantMessage.querySelector('.debug-section');
                                                 
                                                 // Add streaming cursor
                                                 const contentWithCursor = this.currentStreamingContent + '<span class="streaming-cursor">▊</span>';
                                                 streamingDiv.innerHTML = this.parseMarkdown(contentWithCursor);
                                                 
                                                 // Restore debug container if it existed
                                                 if (debugContainer) {
                                                     const messageContent = this.currentAssistantMessage.querySelector('.message-content');
                                                     if (messageContent && !messageContent.querySelector('.debug-section')) {
                                                         messageContent.insertBefore(debugContainer, messageContent.firstChild);
                                                     }
                                                 }
                                                 
                                                 // Throttle code highlighting to improve performance
                                                 if (!this.highlightTimeout) {
                                                     this.highlightTimeout = setTimeout(() => {
                                                         this.highlightCodeBlocks(streamingDiv);
                                                         this.highlightTimeout = null;
                                                     }, 200);
                                                 }
                                                 
                                                 this.scrollToBottom();
                                             }
                                        
                                    } else if (channel === 'highlight') {
                                        // Evidence highlight data (Kotaemon-style)
                                        try {
                                            const highlightData = JSON.parse(content);
                                            console.log('[HIGHLIGHT]', highlightData);
                                            
                                            // Store evidences as array for each document
                                            if (highlightData.doc_rank && highlightData.evidence) {
                                                if (!this.citationHighlights[highlightData.doc_rank]) {
                                                    this.citationHighlights[highlightData.doc_rank] = [];
                                                }
                                                this.citationHighlights[highlightData.doc_rank].push(highlightData.evidence);
                                                
                                                // Re-render info panel with highlights
                                                this.renderInfoPanel();
                                            }
                                        } catch (e) {
                                            console.error('Error parsing highlight data:', e);
                                        }
                                        
                                    } else if (channel === 'done') {
                                        // Streaming complete
                                        console.log('[DONE] Stream completed');
                                             
                                             // Clear any pending highlight timeouts
                                             if (this.highlightTimeout) {
                                                 clearTimeout(this.highlightTimeout);
                                                 this.highlightTimeout = null;
                                             }
                                             
                                             // Finalize answer (remove cursor)
                                             const contentDiv = this.currentAssistantMessage?.querySelector('.message-text');
                                             
                                             if (contentDiv) {
                                                 // Preserve debug container before updating final content
                                                 const debugContainer = this.currentAssistantMessage.querySelector('.debug-section');
                                                 
                                                 const finalContent = this.currentStreamingContent;
                                                 contentDiv.innerHTML = this.parseMarkdown(finalContent);
                                                 
                                                 // Restore debug container if it existed
                                                 if (debugContainer) {
                                                     const messageContent = this.currentAssistantMessage.querySelector('.message-content');
                                                     if (messageContent && !messageContent.querySelector('.debug-section')) {
                                                         messageContent.insertBefore(debugContainer, messageContent.firstChild);
                                                     }
                                                 }
                                                 
                                                 this.highlightCodeBlocks(contentDiv);
                                        }
                                             
                                             // Reset streaming content
                                             this.currentStreamingContent = '';
                                        
                                    } else if (channel === 'error') {
                                        // Error occurred
                                        console.error('[ERROR]', content);
                                        this.addErrorMessage(content);
                                    }
                                    
                                 } catch (e) {
                                     console.error('Error parsing event JSON:', e, 'Line:', line);
                                 }
                             }
                         }
                     }
                 } finally {
                     reader.releaseLock();
                 }
             }

             async handleJsonResponse(response) {
                 try {
                     console.log('Response status:', response.status);
                     console.log('Response headers:', response.headers);
                     
                     const responseText = await response.text();
                     console.log('Raw response text:', responseText);
                     
                     let data;
                     try {

                         console.log('Parsed JSON data:', data);
                     } catch (parseError) {
                         console.error('JSON parse error:', parseError);
                         console.log('Response was not valid JSON, treating as plain text');
                         // If it's not JSON, treat the entire response as the answer
                         data = { content: responseText };
                     }
                     
                     if (data.content && data.content.trim() !== '') {
                         console.log('Creating assistant message and rendering structured response:', data);
                         if (!this.currentAssistantMessage) {
                             this.currentAssistantMessage = this.createAssistantMessage();
                             console.log('Created new assistant message element');
                         }
                         this.renderStructuredResponse(data);
                         this.finalizeMessage();
                     } else if (typeof data === 'string' && data.trim() !== '') {
                         // If data is a string, treat it as the answer
                         console.log('Response is a string, treating as answer:', data);
                         if (!this.currentAssistantMessage) {
                             this.currentAssistantMessage = this.createAssistantMessage();
                         }
                         this.appendToAssistantMessageComplete(data);
                         this.finalizeMessage();
                     } else if (data.content === '') {
                         // Handle empty response
                         console.log('Empty response received, showing default message');
                         if (!this.currentAssistantMessage) {
                             this.currentAssistantMessage = this.createAssistantMessage();
                         }
                         this.appendToAssistantMessageComplete('Sorry, I couldn\'t generate a response. Please try rephrasing your question.');
                         this.finalizeMessage();
                    } else {
                        console.error('No content field in response:', data);
                        console.log('Available fields:', Object.keys(data));
                        this.addErrorMessage('Error: invalid response format. Received: ' + JSON.stringify(data));
                    }
                    
                    // Update chat title after 2 seconds (to allow LLM to generate it)
                    if (this.currentChatId) {
                        setTimeout(() => {
                            this.refreshChatTitle(this.currentChatId);
                        }, 2000);
                    }
                } catch (error) {
                    console.error('Error processing response:', error);
                    this.addErrorMessage('Response processing error: ' + error.message);
                }
            }

            restoreInfoPanelFromMetadata(metadata) {
                // Restore Information Panel from metadata
                if (!metadata || !metadata.retrieved_docs) {
                    console.log('[RESTORE] No metadata or retrieved_docs found');
                    return;
                }
                
                console.log('[RESTORE] Restoring Information Panel with', metadata.retrieved_docs.length, 'docs');
                
                // Clear previous data
                this.retrievedDocs = [];
                this.citationHighlights = {};
                
                // Restore retrieved docs
                for (const docData of metadata.retrieved_docs) {
                    const doc = {
                        rank: docData.rank,
                        content: docData.content,
                        finalScore: docData.score || 0,
                        semanticScore: docData.semantic_score || 0,
                        keywordScore: docData.keyword_score || 0,
                        llmScore: docData.llm_score,
                        docId: docData.doc_id
                    };
                    
                    // Extract source and page from metadata
                    if (docData.metadata) {
                        doc.source = docData.metadata.file_name || 'Unknown';
                        doc.page = docData.metadata.page_label || 'N/A';
                    }
                    
                    this.retrievedDocs.push(doc);
                }
                
                // Restore evidences (citation highlights)
                if (metadata.evidences) {
                    for (const [docRank, evidenceData] of Object.entries(metadata.evidences)) {
                        if (evidenceData.evidences) {
                            this.citationHighlights[parseInt(docRank)] = evidenceData.evidences;
                        }
                    }
                    console.log('[RESTORE] Restored evidences for', Object.keys(this.citationHighlights).length, 'docs');
                }
                
                // Render Information Panel
                this.renderInfoPanel();
            }

            parseMarkdown(content) {
                if (!content) return '';
                
                // Проверяем, является ли контент уже HTML
                if (this.isHTML(content)) {
                    // Санитизируем и возвращаем как есть
                    return this.sanitizeHTML(content);
                }
                
                // Парсим как Markdown
                if (typeof marked === 'undefined') {
                    // Fallback: простое форматирование
                    return this.simpleFormat(content);
                }
                
                try {
                    let html = marked.parse(content);
                    
                    // Конвертируем inline citations [1], [2] в кликабельные ссылки
                    html = this.makeInlineCitationsClickable(html);
                    
                    return html;
                } catch (error) {
                    console.error('Markdown parsing error:', error);
                    return this.simpleFormat(content);
                }
            }
            
            makeInlineCitationsClickable(html) {
                // Ищем [1], [2], [3] и т.д. и заменяем на кликабельные ссылки
                // Используем regex для поиска [число]
                return html.replace(/\[(\d+)\]/g, (match, number) => {
                    return `<a href="#" class="citation-link" onclick="window.chatApp.scrollToCitation(${number}); return false;" title="Jump to source ${number}">[${number}]</a>`;
                });
            }
            
            isHTML(content) {
                // Проверяем, содержит ли контент HTML теги
                const htmlPattern = /<\/?[a-z][\s\S]*>/i;
                return htmlPattern.test(content);
            }
            
            sanitizeHTML(html) {
                // Базовая санитизация - разрешаем безопасные теги
                const allowedTags = ['p', 'br', 'strong', 'em', 'u', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 
                                    'ul', 'ol', 'li', 'a', 'code', 'pre', 'blockquote', 'table', 
                                    'thead', 'tbody', 'tr', 'th', 'td', 'div', 'span', 'img'];
                
                // Простая проверка - если есть script или style, экранируем
                if (/<script|<style|javascript:/i.test(html)) {
                    return this.escapeHtml(html);
                }
                
                return html;
            }
            
            simpleFormat(content) {
                // Простое форматирование для текста без Markdown/HTML
                return this.escapeHtml(content)
                    .replace(/\n\n/g, '</p><p>')
                    .replace(/\n/g, '<br>')
                    .replace(/^/, '<p>')
                    .replace(/$/, '</p>');
            }

             highlightCodeBlocks(container) {
                 if (typeof Prism === 'undefined') {
                     console.log('Prism is not loaded, skipping syntax highlighting');
                     return;
                 }
                 
                 try {
                     // Find all code blocks and enhance them
                     const codeBlocks = container.querySelectorAll('pre code');
                     codeBlocks.forEach((codeBlock, index) => {
                         try {
                             const pre = codeBlock.parentElement;
                             const language = this.detectLanguage(codeBlock.textContent);
                             
                             // Wrap in enhanced code block structure
                             const wrapper = document.createElement('div');
                             wrapper.className = 'code-block';
                             
                             const header = document.createElement('div');
                             header.className = 'code-block-header';
                             header.innerHTML = `
                                 <span class="code-language">${language}</span>
                                 <button class="copy-button" onclick="chatApp.copyCode(this)">Copy</button>
                             `;
                             
                             const enhancedPre = document.createElement('pre');
                             enhancedPre.className = `language-${language} line-numbers`;
                             enhancedPre.innerHTML = `<code class="language-${language}">${codeBlock.innerHTML}</code>`;
                             
                             wrapper.appendChild(header);
                             wrapper.appendChild(enhancedPre);
                             
                             pre.parentNode.replaceChild(wrapper, pre);
                         } catch (error) {
                             console.error('Error enhancing code block:', error);
                         }
                     });
                     
                     // Apply Prism highlighting
                     try {
                         Prism.highlightAllUnder(container);
                     } catch (error) {
                         console.error('Error applying Prism highlighting:', error);
                     }
                     
                     // Apply line numbers
                     try {
                         if (Prism.plugins && Prism.plugins.lineNumbers && typeof Prism.plugins.lineNumbers.hook === 'function') {
                             Prism.plugins.lineNumbers.hook();
                         }
                     } catch (error) {
                         console.error('Error applying line numbers:', error);
                     }
                 } catch (error) {
                     console.error('Error in highlightCodeBlocks:', error);
                 }
             }

            detectLanguage(code) {
                // Simple language detection based on common patterns
                const patterns = {
                    'javascript': /function|const|let|var|=>|console\.log/,
                    'python': /def |import |from |print\(|if __name__/,
                    'java': /public class|import java|System\.out\.print/,
                    'cpp': /#include|std::|cout|cin/,
                    'c': /#include|printf|scanf/,
                    'html': /<html|<div|<span|<p/,
                    'css': /\.|#|@media|@keyframes/,
                    'sql': /SELECT|INSERT|UPDATE|DELETE|FROM|WHERE/,
                    'json': /^\s*[{\[]/,
                    'xml': /<\?xml|<[A-Z]|<[a-z]+>/,
                    'bash': /#!|echo |cd |ls |grep /,
                    'yaml': /^[a-zA-Z_][a-zA-Z0-9_]*:/,
                    'markdown': /^#|^\*\*|^\*|^\-|^\d+\./
                };
                
                for (const [lang, pattern] of Object.entries(patterns)) {
                    if (pattern.test(code)) {
                        return lang;
                    }
                }
                
                return 'text';
            }

            copyCode(button) {

                const text = codeBlock.textContent;

                    button.classList.add('copied');
                    setTimeout(() => {
                        button.textContent = 'Copy';
                        button.classList.remove('copied');

                }).catch(err => {
                    console.error('Failed to copy code:', err);
                    button.textContent = 'Error';
                    setTimeout(() => {
                        button.textContent = 'Copy';
                    }, 2000);
                });
            }

                        credentials: 'include'
                    });

            async switchChat(chatId) {
                if (this.currentChatId === chatId) return;
                
                // Отменяем текущий streaming запрос если есть
                if (this.abortController) {
                    console.log('Aborting current streaming request');
                    this.abortController.abort();
                    this.abortController = null;
                    this.streamingChatId = null;
                }
                
                // Очищаем состояние
                this.setStreaming(false);
                this.resetMessageState();
                
                this.currentChatId = chatId;
                console.log('Switched to chat:', chatId);
                
                // Очищаем текущие сообщения
                this.chatMessages.innerHTML = '';
                
                try {
                    // Загружаем сообщения чата
                    const response = await fetch(`/chat/chats/${chatId}`, {
                        credentials: 'include'
                    });
                    if (!response.ok) throw new Error('Failed to load chat');
                    
                    const chat = await response.json();
                    console.log('Loaded chat data:', chat);
                    
                    // Отображаем сообщения
                    if (chat.messages && chat.messages.length > 0) {
                        console.log('[SWITCH] Loading', chat.messages.length, 'messages');
                        for (const msg of chat.messages) {
                            console.log('[SWITCH] Message:', msg.role, 'has metadata:', !!msg.metadata);
                            if (msg.metadata) {
                                console.log('[SWITCH] Metadata keys:', Object.keys(msg.metadata));
                                if (msg.metadata.tool_calls) {
                                    console.log('[SWITCH] Tool calls count:', msg.metadata.tool_calls.length);
                                }
                                if (msg.metadata.sources) {
                                    console.log('[SWITCH] Sources count:', msg.metadata.sources.length);
                                }
                            }
                            
                            if (msg.role === 'user') {
                                this.addUserMessage(msg.content);
                            } else if (msg.role === 'assistant') {
                                // Восстанавливаем полное сообщение с metadata
                                this.restoreAssistantMessage(msg.content, msg.metadata);
                            }
                        }
                    } else {
                        console.log('[SWITCH] No messages in chat, showing welcome');
                        // Показываем приветствие для нового чата
                        this.addAssistantMessage('Hello! I\'m your AI assistant. How can I help you?');
                    }
                    
                    this.renderChats();
                    this.scrollToBottom();
                } catch (error) {
                    console.error('Error switching chat:', error);
                    this.addAssistantMessage('Hello! I\'m your AI assistant. How can I help you?');
                }
            }

            async deleteChat(chatId, event) {
                event.stopPropagation();
                
                if (!confirm('Delete this chat?')) return;
                
                try {
                    const response = await fetch(`/chat/chats/${chatId}`, {
                        method: 'DELETE',
                        credentials: 'include'
                    });
                    
                    if (!response.ok) throw new Error('Failed to delete chat');
                    
                    console.log('Deleted chat:', chatId);
                    
                    // Удаляем из списка
                    this.chats = this.chats.filter(c => c.id !== chatId);
                    this.renderChats();
                    
                    // Если удалили текущий чат
                    if (this.currentChatId === chatId) {
                        if (this.chats.length > 0) {
                            await this.switchChat(this.chats[0].id);
                        } else {
                            await this.createNewChat();
                        }
                    }
                } catch (error) {
                    console.error('Error deleting chat:', error);
                }
            }

                if (!this.chatsList) {

            formatChatDate(date) {
                const now = new Date();
                const diff = now - date;
                const minutes = Math.floor(diff / 60000);
                const hours = Math.floor(diff / 3600000);
                const days = Math.floor(diff / 86400000);
                
                if (minutes < 1) return 'только что';
                if (minutes < 60) return `${minutes} мин назад`;
                if (hours < 24) return `${hours} ч назад`;
                if (days < 7) return `${days} дн назад`;
                
                return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
            }

                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;

            addDocumentInfo(content) {
                // Parse document info from markdown content
                // Expected format: **Document X**\n- **Final Score**: ...
                try {
                    const docInfo = this.parseDocumentInfo(content);
                    if (docInfo) {
                        this.retrievedDocs.push(docInfo);
                        this.renderInfoPanel();
                    }
                } catch (e) {
                    console.error('Error parsing document info:', e);
                }
            }
            
            parseDocumentInfo(content) {
                // Parse markdown content to extract document info
                const lines = content.split('\n');
                const doc = {};
                
                // Extract rank from "**Document X**"
                const rankMatch = content.match(/\*\*Document (\d+)\*\*/);
                if (rankMatch) {
                    doc.rank = parseInt(rankMatch[1]);
                }
                
                // Extract scores
                const scoreMatch = content.match(/\*\*Final Score\*\*: ([\d.]+)/);
                if (scoreMatch) {
                    doc.finalScore = parseFloat(scoreMatch[1]);
                }
                
                const semanticMatch = content.match(/Semantic: ([\d.]+)/);
                if (semanticMatch) {
                    doc.semanticScore = parseFloat(semanticMatch[1]);
                }
                
                const keywordMatch = content.match(/Keyword: ([\d.]+)/);
                if (keywordMatch) {
                    doc.keywordScore = parseFloat(keywordMatch[1]);
                }
                
                // Extract LLM Relevance score
                const llmMatch = content.match(/🤖 LLM Relevance\*\*: ([\d.]+)\/10/);
                if (llmMatch) {
                    doc.llmScore = parseFloat(llmMatch[1]);
                }
                
                // Extract source metadata
                const sourceMatch = content.match(/\*\*Source\*\*: ([^,]+), Page: (.+)/);
                if (sourceMatch) {
                    doc.source = sourceMatch[1].trim();
                    doc.page = sourceMatch[2].trim();
                }
                
                // Extract content from code block
                const codeBlockMatch = content.match(/```\n([\s\S]+?)\n```/);
                if (codeBlockMatch) {
                    doc.content = codeBlockMatch[1].trim();
                }
                
                return doc;
            }

            highlightEvidences(content, docRank) {
                // Check if there are evidences for this document (Kotaemon-style)
                const evidences = this.citationHighlights[docRank];
                
                if (!evidences || evidences.length === 0) {
                    return this.escapeHtml(content);
                }
                
                console.log(`[HIGHLIGHT] Highlighting ${evidences.length} evidences in doc ${docRank}`);
                console.log(`[HIGHLIGHT] Content length: ${content.length}`);
                console.log(`[HIGHLIGHT] Content preview: "${content.substring(0, 200)}..."`);
                
                // Create regex patterns for each evidence (case-insensitive, flexible whitespace and punctuation)
                const patterns = [];
                
                for (const evidence of evidences) {
                    console.log(`[HIGHLIGHT] Processing evidence: "${evidence}"`);
                    
                    // Escape special regex characters except spaces and punctuation
                    let pattern = evidence
                        .replace(/[.*+?^${}()|[\]\\]/g, '\\$&')  // Escape regex special chars
                        .replace(/[.,;:!?'"()[\]{}]/g, '[.,;:!?\'"()\\[\\]{}]*')  // Allow optional punctuation
                        .replace(/\s+/g, '\\s+');  // Allow flexible whitespace
                    
                    console.log(`[HIGHLIGHT] Regex pattern: ${pattern}`);
                    
                    // Try full pattern first
                    patterns.push({
                        full: new RegExp(pattern, 'gi'),
                        evidence: evidence,
                        partial: null
                    });
                    
                    // Also create partial pattern (first 60% of words) for fuzzy matching
                    const words = evidence.split(/\s+/);
                    if (words.length >= 3) {
                        const partialWords = words.slice(0, Math.max(3, Math.ceil(words.length * 0.6)));
                        const partialEvidence = partialWords.join(' ');
                        let partialPattern = partialEvidence
                            .replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
                            .replace(/[.,;:!?'"()[\]{}]/g, '[.,;:!?\'"()\\[\\]{}]*')
                            .replace(/\s+/g, '\\s+');
                        
                        patterns.push({
                            full: null,
                            evidence: evidence,
                            partial: new RegExp(partialPattern, 'gi')
                        });
                    }
                }
                
                // Find all matches and their positions
                const matches = [];
                
                for (const {full, partial, evidence} of patterns) {
                    const regex = full || partial;
                    const matchType = full ? 'exact' : 'partial';
                    
                    let match;
                    while ((match = regex.exec(content)) !== null) {
                        // Avoid infinite loop on zero-length matches
                        if (match.index === regex.lastIndex) {
                            regex.lastIndex++;
                        }
                        
                        // Extend match to approximately evidence length for partial matches
                        let endIndex = match.index + match[0].length;
                        if (matchType === 'partial') {
                            endIndex = Math.min(content.length, match.index + evidence.length + 20);
                        }
                        
                        matches.push({
                            start: match.index,
                            end: endIndex,
                            text: content.substring(match.index, endIndex),
                            evidence: evidence,
                            type: matchType
                        });
                        
                        console.log(`[HIGHLIGHT] ✅ ${matchType.toUpperCase()} match: "${evidence.substring(0, 40)}..." at ${match.index}`);
                        break; // Only first match per evidence
                    }
                }
                
                if (matches.length === 0) {
                    console.log('[HIGHLIGHT] ❌ No regex matches found, trying simple substring search...');
                    
                    // Fallback: simple case-insensitive substring search
                    for (const evidence of evidences) {
                        const lowerEvidence = evidence.toLowerCase();
                        const lowerContent = content.toLowerCase();
                        
                        const index = lowerContent.indexOf(lowerEvidence);
                        if (index !== -1) {
                            const endIndex = Math.min(content.length, index + evidence.length + 20);
                            matches.push({
                                start: index,
                                end: endIndex,
                                text: content.substring(index, endIndex),
                                evidence: evidence,
                                type: 'substring'
                            });
                            console.log(`[HIGHLIGHT] ✅ Substring match: "${evidence.substring(0, 40)}..." at ${index}`);
            } else {
                            console.log(`[HIGHLIGHT] ❌ Substring not found: "${evidence.substring(0, 40)}..."`);
                        }
                    }
                    
                    if (matches.length === 0) {
                        console.log('[HIGHLIGHT] ❌ No matches found with any method');
                        return this.escapeHtml(content);
                    }
                }
                
                // Sort matches by position
                matches.sort((a, b) => a.start - b.start);
                
                // Build result with highlights
                let result = '';
                let lastIndex = 0;
                
                for (const match of matches) {
                    // Add text before match
                    result += this.escapeHtml(content.substring(lastIndex, match.start));
                    
                    // Add highlighted match
                    result += '<span class="citation-highlight">' + 
                             this.escapeHtml(match.text) + 
                             '</span>';
                    
                    lastIndex = match.end;
                }
                
                // Add remaining text
                result += this.escapeHtml(content.substring(lastIndex));
                
                console.log(`[HIGHLIGHT] ✅ Applied ${matches.length} highlights`);
                return result;
            }
